[metadata]
name = trellix_dlp_sdk
version = 1.0.0
description = A Python SDK for interacting with Trellix DLP On-Prem
author = sacumen
url = https://github.com/

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    pydantic>=2.11.0
    requests>=2.31.0
    tenacity>=4.4.0
    boto3>=1.39.10
    vcrpy>=5.1.0
    pytest>=8.0.0

[options.packages.find]
where = src